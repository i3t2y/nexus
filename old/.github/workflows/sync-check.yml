# 校验根 libs/ 与各 Space 的 libs/ 一致 —— 防止 push 旧库导致 HF Space 跑过时代码。
# 须先本地跑 bash scripts/sync-spaces.sh 再 commit；本 Action 是兜底闸门。
# 同 job 内顺带做 py_compile / tsc 语法闸门，挡低级语法错误进 HF。
name: sync-check

on:
  push:
    paths:
      - "libs/**"
      - "spaces/*/libs/**"
      - "scripts/sync-spaces.sh"
      - "scripts/sync-logic-bucket.sh"
      - ".github/workflows/sync-check.yml"
      - "spaces/*/app/**"
      - "spaces/hermes/scripts/**"
      - "docker/**"
      - "workers/**"
  pull_request:
    paths:
      - "libs/**"
      - "spaces/*/libs/**"
      - "scripts/sync-spaces.sh"
      - "scripts/sync-logic-bucket.sh"
      - "spaces/hermes/scripts/**"
      - "docker/**"

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 libs 同步一致性
        run: bash scripts/sync-spaces.sh --check

      - name: py_compile 各 Space app + 根 libs（仅语法，无需运行时依赖）
        run: |
          set -e
          fail=0
          # hermes 逻辑进 Bucket 不走 git 副本:直接编 git 真源(spaces/hermes/app + scripts + libs)
          for f in spaces/hermes/app/*.py spaces/hermes/scripts/*.py; do
            python3 -m py_compile "$f" || fail=1
          done
          # 3 non-hermes Space 仍走 git 副本 build context:编其 app(scripts 与 libs 跟随)
          for s in langgraph claude-code codex; do
            for f in spaces/$s/app/*.py; do
              python3 -m py_compile "$f" || fail=1
            done
          done
          for f in libs/shared/*.py libs/storage/*.py; do
            python3 -m py_compile "$f" || fail=1
          done
          exit $fail

      - name: 装 Node 依赖 + tsc 校验 Worker
        run: |
          cd workers/gateway
          npm install
          npx tsc --noEmit
