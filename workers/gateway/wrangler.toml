name = "nexus-gateway"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[vars]
# HF 用户名；下游 URL 拼成 https://{owner}-{repo}.hf.space
SPACE_OWNER = "your-hf-username"

# 显式覆盖各 Space URL（可省，省则按 OWNER 拼接）
# LANGGRAPH_URL = "https://..."
# CLAUDE_URL = "https://..."
# CODEX_URL = "https://..."

# NEXUS_API_KEY 用 secret，不写这里：
# npx wrangler secret put NEXUS_API_KEY
# 下游若为私有 HF Space，HF 层访问需 HF_TOKEN（公开 Space 可不配）：
# npx wrangler secret put HF_TOKEN

# Cron 保活：每 10 分钟探测一次各 Space（免费额度 5 个 cron / Worker）。
# 注意：完全规律易形成可观测周期，HF 侧主要靠你的外部监测网站；
# 这里作补充，建议保持低频。
[triggers]
crons = ["*/10 * * * *"]
