# 同步 memgraph 到 HF Space nmem/memlg + HF Bucket nmem/logic
# 三件套统一 Bucket: GitHub → Actions → HF Space (三文件) + HF Bucket (逻辑层)
# 三文件和逻辑层分开推: 改三文件才推 Space (触发 rebuild), 改 nworker 才 sync Bucket
#
# 命名约定 (沿用 nexus per-Space token):
#   HF_M_TOKEN   → nmem/memlg     (mem0 后端, 本 workflow)
#
# 前提: GitHub Secret HF_M_TOKEN = nmem 账号 HF token
#       HF Bucket nmem/logic 已创建且已挂载到 Space /data
name: Sync memgraph → HF Space + Bucket

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "memgraph/Dockerfile"
      - "memgraph/README.md"
      - "memgraph/start.sh"
      - "memgraph/nworker/**"
      - ".github/workflows/deploy-memgraph.yml"

jobs:
  # ── 推三文件到 HF Space (触发 rebuild) ──
  deploy-space:
    if: |
      !contains(github.event.head_commit.message, '[skip space]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nexus
        uses: actions/checkout@v4

      - name: 配置 git HF push 身份
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone HF Space repo (nmem/memlg)
        env:
          HF_M_TOKEN: ${{ secrets.HF_M_TOKEN }}
        run: |
          git clone "https://user:${HF_M_TOKEN}@huggingface.co/spaces/nmem/memlg" hf-space
          cd hf-space
          git checkout main || git checkout -B main

      - name: 拷贝三文件 → HF repo
        run: |
          for f in Dockerfile README.md start.sh; do
            cp "memgraph/${f}" "hf-space/${f}"
          done

      - name: Commit + push (若有变更)
        env:
          HF_M_TOKEN: ${{ secrets.HF_M_TOKEN }}
        run: |
          cd hf-space
          git add Dockerfile README.md start.sh
          if git diff --cached --quiet; then
            echo "[sync] 三文件无变更, 跳过 push"
          else
            git commit -m "sync memgraph 三文件 (触发 rebuild)"
            git push "https://user:${HF_M_TOKEN}@huggingface.co/spaces/nmem/memlg" main
            echo "::notice::已 push 三文件到 nmem/memlg, HF 自动触发 rebuild"
          fi

  # ── sync 逻辑层到 HF Bucket (不触发 rebuild) ──
  deploy-bucket:
    if: |
      !contains(github.event.head_commit.message, '[skip bucket]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nexus
        uses: actions/checkout@v4

      - name: Install hf CLI
        run: pip install -q "huggingface_hub[cli]>=1.0"

      - name: Sync nworker → HF Bucket (nmem/logic 根目录)
        env:
          HF_TOKEN: ${{ secrets.HF_M_TOKEN }}
        run: |
          hf buckets sync ./memgraph/nworker hf://buckets/nmem/logic
          echo "::notice::nworker 已同步到 nmem/logic Bucket 根目录"
