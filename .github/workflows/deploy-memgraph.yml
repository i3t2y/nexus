# 同步 memgraph 三件 + nworker 到 HF Space nmem/memlg + HF Bucket nmem/logic
# 三件套统一 Bucket: GitHub → Actions → HF Space (三文件) + HF Bucket (逻辑层)
#
# 命名约定 (沿用 nexus per-Space token):
#   HF_H_TOKEN   → sonoke/h       (hermes 主控)
#   HF_L_TOKEN   → sonoke/l       (langgraph 编排)
#   HF_CC_TOKEN  → sonoke/cc      (claude-code 执行器)
#   HF_C_TOKEN   → sonoke/c       (codex 执行器)
#   HF_M_TOKEN   → nmem/memlg     (mem0 后端, 本 workflow)
#
# 触发: 手动 workflow_dispatch 或 push 涉 spaces/memgraph/** 变更。
# 前提: GitHub Secret HF_M_TOKEN = nmem 账号 HF token (对 nmem/memlg Space 写权限)
#       HF Bucket nmem/logic 已创建且已挂载到 Space /data
name: Sync memgraph → HF Space + Bucket

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "spaces/memgraph/**"
      - ".github/workflows/deploy-memgraph.yml"

jobs:
  deploy-memgraph:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout nexus 源仓
        uses: actions/checkout@v4

      - name: Install hf CLI
        run: pip install -q "huggingface_hub[cli]>=1.0"

      - name: 配置 git HF push 身份
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Clone HF Space repo (nmem/memlg)
        env:
          HF_M_TOKEN: ${{ secrets.HF_M_TOKEN }}
        run: |
          set -e
          git clone "https://user:${HF_M_TOKEN}@huggingface.co/spaces/nmem/memlg" hf-space
          cd hf-space
          git fetch --all
          git checkout main || git checkout -B main

      - name: 拷贝三文件 → HF repo 根
        run: |
          set -e
          src="spaces/memgraph"
          dst="hf-space"
          for f in Dockerfile README.md start.sh; do
            cp "${src}/${f}" "${dst}/${f}"
            echo "[sync] ${src}/${f} → ${dst}/${f}"
          done

      - name: Commit + push 三文件 (若有变更)
        env:
          HF_M_TOKEN: ${{ secrets.HF_M_TOKEN }}
        run: |
          set -e
          cd hf-space
          git add Dockerfile README.md start.sh
          if git diff --cached --quiet; then
            echo "[sync] 三文件无变更, 跳过 push"
          else
            git commit -m "sync memgraph 三文件 (触发 rebuild)"
            git push "https://user:${HF_M_TOKEN}@huggingface.co/spaces/nmem/memlg" main
            echo "::notice::已 push 三文件到 nmem/memlg, HF 自动触发 rebuild"
          fi

      - name: Sync nworker → HF Bucket (nmem/logic 根目录)
        env:
          HF_M_TOKEN: ${{ secrets.HF_M_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_M_TOKEN }}
        run: |
          hf buckets sync ./spaces/memgraph/nworker hf://buckets/nmem/logic
          echo "::notice::nworker 已同步到 nmem/logic Bucket 根目录"
