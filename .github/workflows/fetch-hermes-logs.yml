# Fetch hermes HF Space logs (sonoke/nexus)
#
# 背景 (2026-09-12): hermes = HF Space `sonoke/nexus`, 入口 https://sonoke-nexus.hf.space
#   该 Space `auth_required: true`, 匿名只有 /api/status 与 /api/health 可读,
#   /api/logs /api/stats /api/state /api/tasks 全部 401 ⇒ 本机无 token 时看不到应用日志。
#   解法沿用 n-omn 那套「借 CI 的手取证」: GitHub Actions 拿着仓内 secret 去抓。
#
# token: NEX_HF_TOKEN (i3t2y/nexus Actions secret, 2026-09-12 建立, 对 sonoke/nexus 有读权限)
#   注: GitHub secret 明文不可读 — 故本 workflow 必须放在 i3t2y/nexus 仓内才能用上它。
#
# 快照语义 (沿用 xnexus 实证): 连接建立瞬间 HF 会倾吐容器自启动以来的全部积压历史,
#   随后转实时细流。故「一次抓取 = boot 至今全量叙事」, 不是 60 秒切片。
#   rc=28 = curl --max-time 60 兜底超时 = 正常, 已落盘字节照常有效。
#
# 脱敏设计 (比 n-omn 版更严, 因为 hermes 是 Telegram 入口的云大脑, 日志可能含对话内容):
#   默认 redact 模式 — 命中即就地改写为 ***REDACTED***, 并统计命中规则编号与行数。
#   可选 fail 模式 — 命中即整 job 失败, 不产出任何证据 (宁丢一帧日志, 不泄一凭据)。
#   publish (提交到 evidence 分支) 默认关闭; 且只要脱敏闸命中过, 一律拒绝 publish。

name: Fetch hermes Space logs (sonoke/nexus)

on:
  workflow_dispatch:
    inputs:
      log_type:
        description: 抓哪类日志
        type: choice
        options: [run, build, both]
        default: both
      space:
        description: HF Space (Owner/Name)
        type: string
        default: 'sonoke/nexus'
      desens_mode:
        description: 脱敏模式 (redact=就地打码并继续, fail=命中即整 job 失败)
        type: choice
        options: [redact, fail]
        default: redact
      publish:
        description: 是否提交到 evidence 分支 (公开仓, 谨慎)
        type: boolean
        default: false
      retention_days:
        description: artifact 保留天数 (1-90)
        type: string
        default: '7'

permissions:
  contents: write

concurrency:
  group: fetch-hermes-logs
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 抓取 HF Space 日志
        id: fetch
        env:
          NEX_HF_TOKEN: ${{ secrets.NEX_HF_TOKEN }}
        run: |
          set -euo pipefail
          LOG_TYPE="${{ inputs.log_type || 'both' }}"
          SPACE="${{ inputs.space || 'sonoke/nexus' }}"
          TS=$(date -u '+%Y%m%d-%H%M')
          mkdir -p out
          if [ -z "${NEX_HF_TOKEN:-}" ]; then
            echo "::error::NEX_HF_TOKEN 为空 — 请确认 secret 已配置在本仓"
            exit 1
          fi
          fetch_one() {
            local kind="$1"
            echo "=== fetch $SPACE logs/$kind @ $TS ==="
            curl -sS -N --max-time 60 \
              -H "Authorization: Bearer ${NEX_HF_TOKEN}" \
              "https://huggingface.co/api/spaces/${SPACE}/logs/${kind}" \
              -o "out/${kind}.log" && rc=0 || rc=$?
            local _bytes=0
            [ -f "out/${kind}.log" ] && _bytes=$(wc -c < "out/${kind}.log" || echo 0)
            echo "fetch_one $kind: rc=$rc bytes=${_bytes} (rc=28 为 60s 兜底超时, 属正常)"
            case "$rc" in
              0|28) [ "$_bytes" -gt 0 ] && return 0 || { echo "WARN: $kind 空窗 (0 字节, Space 闲或未启动)"; return 0; } ;;
              *)    echo "WARN: $kind 真失败 (rc=$rc), 已落盘 ${_bytes}B 保留作部分证据"; return 1 ;;
            esac
          }
          case "$LOG_TYPE" in
            run)   fetch_one run ;;
            build) fetch_one build ;;
            both)  fetch_one run; fetch_one build ;;
          esac
          echo "ts=$TS" >> "$GITHUB_OUTPUT"
          echo "space=$SPACE" >> "$GITHUB_OUTPUT"
          echo "log_type=$LOG_TYPE" >> "$GITHUB_OUTPUT"

      - name: 脱敏闸
        id: desens
        run: |
          set -euo pipefail
          MODE="${{ inputs.desens_mode || 'redact' }}"
          HIT=0
          REPORT=""
          check() {
            # $1=规则编号 $2=描述 $3=正则
            local id="$1" desc="$2" re="$3" n=0
            for f in out/*.log; do
              [ -f "$f" ] || continue
              if grep -qE "$re" "$f"; then
                n=$(( n + $(grep -cE "$re" "$f" || echo 0) ))
                if [ "$MODE" = "redact" ]; then
                  sed -i -E "s@${re}@***REDACTED***@g" "$f"
                fi
              fi
            done
            if [ "$n" -gt 0 ]; then
              HIT=1
              REPORT="${REPORT}- **${id}** ${desc}: ${n} 行\n"
              if [ "$MODE" = "fail" ]; then
                echo "::error::脱敏闸拦 (${id} ${desc}): ${n} 行命中, fail 模式整 job 终止"
              fi
            fi
          }

          check R01 "HF token (hf_)"                'hf_[A-Za-z0-9]{20,}'
          check R02 "NVIDIA NIM key (nvapi-)"       'nvapi-[A-Za-z0-9_-]{20,}'
          check R03 "OpenAI/SiliconFlow key (sk-)"  'sk-[A-Za-z0-9]{20,}'
          check R04 "Bearer / PSK 实值"              '(Bearer|X-Internal-PSK)[^A-Za-z0-9]{1,3}[A-Za-z0-9_.-]{16,}'
          check R05 "Telegram bot token"            '[0-9]{8,10}:[A-Za-z0-9_-]{35}'
          check R06 "GitHub token (ghp/gho/pat)"    'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}'
          check R07 "Google API key (AIza)"         'AIza[0-9A-Za-z_-]{35}'
          check R08 "AWS access key (AKIA)"         'AKIA[0-9A-Z]{16}'
          check R09 "Postgres/Neon DSN 含口令"       'postgres(ql)?://[^[:space:]]*:[^[:space:]]*@'
          check R10 "通用 *_TOKEN/*_KEY/*_SECRET/*_PASSWORD/PSK 实值" '(TOKEN|KEY|SECRET|PASSWORD|PASSWD|PSK|DSN)[^A-Za-z0-9]{1,3}[A-Za-z0-9_-]{16,}'

          if [ "$MODE" = "fail" ] && [ "$HIT" = "1" ]; then
            exit 1
          fi
          echo "hits=$HIT" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          {
            echo "## 脱敏闸 (mode=${MODE})"
            echo ""
            if [ "$HIT" = "1" ]; then
              printf "%b" "$REPORT"
              echo ""
              echo "redact 模式下已就地打码; **只要命中过, 一律拒绝 publish 到 evidence 分支**。"
            else
              echo "未命中任何凭据形态。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 字节摘要
        if: always()
        run: |
          {
            echo "## fetch ${{ steps.fetch.outputs.space }} @ ${{ steps.fetch.outputs.ts }}"
            echo ""
            echo "| kind | bytes |"
            echo "|------|-------|"
            for f in out/*.log; do
              [ -f "$f" ] || continue
              echo "| $(basename "$f" .log) | $(wc -c < "$f") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-logs-${{ steps.fetch.outputs.ts }}
          path: out/*.log
          retention-days: ${{ fromJSON(inputs.retention_days || '7') }}
          if-no-files-found: warn

      - name: 落 evidence 分支 (可选, 默认关)
        if: inputs.publish && steps.desens.outputs.hits != '1'
        run: |
          set -euo pipefail
          TS="${{ steps.fetch.outputs.ts }}"
          LOG_TYPE="${{ steps.fetch.outputs.log_type }}"
          BRANCH="evidence"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin
          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            git checkout "$BRANCH"
            git pull --rebase origin "$BRANCH" 2>/dev/null || true
          else
            git checkout --orphan "$BRANCH"
            git rm -rf . 2>/dev/null || true
          fi
          DEST_DIR="logs/sonoke--nexus"
          mkdir -p "$DEST_DIR"
          for f in out/*.log; do
            [ -f "$f" ] || continue
            cp "$f" "${DEST_DIR}/${TS}-$(basename "$f" .log).log"
          done
          find "$DEST_DIR" -name '*.log' -mtime +7 -delete || true
          git add -A "${DEST_DIR}/"
          if git diff --cached --quiet; then
            echo "无新快照, skip commit"
          else
            git commit -m "chore(evidence): hermes $LOG_TYPE logs ${TS} [skip ci]"
            git push origin "$BRANCH"
          fi

      - name: publish 被拒提示
        if: inputs.publish && steps.desens.outputs.hits == '1'
        run: |
          echo "::warning::脱敏闸命中过, 已按设计拒绝 publish。日志仍在 artifact 中 (已被打码)。"
          echo "确需归档请先人工核对 artifact 内容, 或改 desens_mode=fail 确认零命中后再跑。"
