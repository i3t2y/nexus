# 语法/类型闸门:挡低级语法错误进 HF Space。
# 批1 搬仓(34f057d)后真位对齐:hermes/{app,scripts,libs} + workers/gateway。
# sync-spaces.sh(根 libs ↔ 三 Space build context 一致性)留 old/scripts/ 待三 Space(langgraph/claude-code/codex)重建,当前 skip。
# 2026-09-05: memgraph 废弃, 整体移入 old/memgraph-20260905/(含其 deploy workflow), 本闸门不再引用。
name: sync-check

on:
  push:
    paths:
      - "hermes/app/**"
      - "hermes/scripts/**"
      - "hermes/libs/**"
      - "workers/gateway/**"
      - "scripts/sync-logic-bucket.sh"
      - "docker/**"
      - ".github/workflows/sync-check.yml"
  pull_request:
    paths:
      - "hermes/app/**"
      - "hermes/scripts/**"
      - "hermes/libs/**"
      - "workers/gateway/**"
      - "docker/**"

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验 libs 同步一致性(待三 Space 重建)
        run: |
          # sync-spaces.sh 留 old/scripts/ 待重建;三 Space 仓内无活动代码。
          # 将来三 Space(langgraph/claude-code/codex)重建 + 脚本挪根 scripts/ 后此条件自动转真。
          if [ -f scripts/sync-spaces.sh ] && [ -d spaces ]; then
            bash scripts/sync-spaces.sh --check
          else
            echo "[sync-check] sync-spaces.sh 未在根 scripts/ 或 spaces/ 不存 → skip(三 Space 待重建)"
          fi

      - name: py_compile 现役 py(仅语法,无需运行时依赖)
        run: |
          set -e
          fail=0
          # hermes 逻辑层(进 Bucket 不走 git 副本,直接编 git 真源)
          for f in $(find hermes/app hermes/scripts hermes/libs \
                     -name "*.py" -not -path "*/__pycache__/*" 2>/dev/null); do
            python3 -m py_compile "$f" || fail=1
          done
          exit $fail

      - name: 装 Node 依赖 + tsc 校验 Worker
        run: |
          cd workers/gateway
          npm install
          npx tsc --noEmit
