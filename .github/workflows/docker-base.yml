# 构建/推送 Nexus GHCR base 镜像 ghcr.io/<owner>/nexus-base:stable
# 永续改造"镜像层":依赖打 base 镜像,各 Space Dockerfile ARG BASE_IMAGE=...:stable + FROM ${BASE_IMAGE} 引用。
# 触发:手动 workflow_dispatch 或 push 涉 docker/** 变更(依赖升级时)
# 前提:GitHub repo Settings → Actions → Workflow permissions 需 "Read and write permissions"
#       (GHCR 推送需 GITHUB_TOKEN packages:write)
#
# 注意:owner 用 github.repository_owner 自动取 repo owner(即 GHCR 用户名);
#       部署时各 Space Dockerfile 的 ARG BASE_IMAGE 默认值 ghcr.io/<owner>/nexus-base:stable
#       的 <owner> 需与此 owner 一致。
name: Build & Push nexus-base (GHCR)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docker/**"

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nexus-base

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push :stable(浮动标签)
        uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/nexus-base.Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:stable
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 提示
        run: |
          echo "::notice::nexus-base 已推 :stable + :${GITHUB_SHA::7} (回退锚点)"
          echo "各 Space Dockerfile 的 ARG BASE_IMAGE 默认值指向此 :stable;升级后改 README 一字符 push HF 触发 rebuild。"
